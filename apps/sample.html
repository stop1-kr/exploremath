<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>예시 활동: 기록 제출 연습</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 20px 96px;
    background: #25473B;
    color: #F2F0E6;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .who { margin: 0 0 28px; color: rgba(242, 240, 230, 0.7); }
  label { display: block; margin: 20px 0 6px; font-weight: 600; }
  input, textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid rgba(242, 240, 230, 0.25);
    border-radius: 10px;
    background: rgba(8, 20, 15, 0.35);
    color: inherit;
    font: inherit;
    font-size: 17px;
  }
  textarea { min-height: 120px; resize: vertical; }
  button {
    margin-top: 24px;
    width: 100%;
    min-height: 52px;
    border: 0;
    border-radius: 10px;
    background: #F2F0E6;
    color: #1B372E;
    font: inherit;
    font-size: 17px;
    font-weight: 700;
  }
</style>
</head>
<body>
<main>
  <h1>예시 활동: 기록 제출 연습</h1>
  <p class="who" id="who"></p>

  <label for="q1">72를 소인수분해해 보세요.</label>
  <input id="q1" autocomplete="off" placeholder="예: 2 × 2 × 2 × 3 × 3">

  <label for="q2">소인수분해를 하며 알게 된 점을 써 보세요.</label>
  <textarea id="q2"></textarea>

  <button type="button" id="submitBtn">선생님께 제출하기</button>
</main>

<!-- ▼ 수학 탐구 월드 연결 (기록을 모으는 활동에만 넣어요) -->
<script src="../js/config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/common.js?v=5"></script>
<script src="../js/activity.js?v=5" data-activity="sample"></script>
<!-- ▲ -->

<script>
  const me = EMWActivity.student();
  document.getElementById('who').textContent = me
    ? `${me.grade}학년 ${me.cls}반 ${me.num}번 학생`
    : '로그인하지 않은 상태예요.';

  document.getElementById('submitBtn').addEventListener('click', () => {
    EMWActivity.submit({
      '72의 소인수분해': document.getElementById('q1').value,
      '알게 된 점': document.getElementById('q2').value,
    });
  });
</script>
</body>
</html>
